[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904"]
exclude = ["ml/notebooks"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["services", "shared"]
omit = ["*/tests/*", "*/migrations/*", "ml/notebooks/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
