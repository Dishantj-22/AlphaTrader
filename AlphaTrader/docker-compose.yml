version: "3.9"

x-common-env: &common-env
  ENVIRONMENT: development
  TIMESCALE_URL: postgresql+asyncpg://trader:trader@timescaledb:5432/alphatrader
  POSTGRES_URL: postgresql+asyncpg://trader:trader@timescaledb:5432/alphatrader
  MONGO_URI: mongodb://mongo:27017/alphatrader
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  # ─── Infrastructure ───────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: alphatrader
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
      POSTGRES_DB: alphatrader
    volumes:
      - timescale_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://trader:trader@timescaledb:5432/alphatrader
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --serve-artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on: [timescaledb]

  # ─── Application Services ────────────────────────────────────
  api_gateway:
    build:
      context: .
      target: api_gateway
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      SECRET_KEY: dev-secret-change-in-prod
    depends_on: [kafka, redis, timescaledb]
    restart: unless-stopped

  ingestion:
    build:
      context: .
      target: ingestion
    environment:
      <<: *common-env
    depends_on: [kafka]
    restart: unless-stopped

  feature_engine:
    build:
      context: .
      target: feature_engine
    environment:
      <<: *common-env
    depends_on: [kafka, redis]
    restart: unless-stopped

  signal_engine:
    build:
      context: .
      target: signal_engine
    environment:
      <<: *common-env
    depends_on: [kafka, redis, mlflow]
    restart: unless-stopped

  news_sentiment:
    build:
      context: .
      target: news_sentiment
    environment:
      <<: *common-env
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    depends_on: [kafka]
    restart: unless-stopped

  # ─── Monitoring ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    depends_on: [prometheus]

volumes:
  zookeeper_data:
  kafka_data:
  timescale_data:
  mongo_data:
  redis_data:
  mlflow_artifacts:
  huggingface_cache:
  grafana_data:
